<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRALALA</title>
  <meta name="description" content="Minimalistische Meme-Coin Landingpage" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <video
    id="bgVideo"
    class="bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="./assets/background.mp4" type="video/mp4" />
    <source src="./assets/background.webm" type="video/webm" />
  </video>

  <div class="video-fade" aria-hidden="true"></div>

  <main class="page">
    <section class="bottom-panel" aria-label="Social links">
      <div class="ca-box" id="caBox">PASTE_YOUR_CA_HERE</div>

      <div class="socials">
        <a
          class="social-btn"
          id="xBtn"
          href="https://x.com/yourprofile"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="X öffnen"
        >
          X
        </a>

        <a
          class="social-btn"
          id="tiktokBtn"
          href="https://www.tiktok.com/@yourprofile"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="TikTok öffnen"
        >
          TikTok
        </a>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
